version: 2
updates:
  # "bun" (not "npm") — the npm ecosystem does not read or update bun.lock,
  # so it bumps package.json alone and leaves the lockfile stale, breaking
  # `bun install --frozen-lockfile` in CI and on Cloudflare Workers Builds.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      routine-dependencies:
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        update-types:
          - "major"
    ignore:
      # typescript-eslint declares peer `typescript: ">=4.8.4 <6.1.0"`, so TS 7
      # breaks lint/typecheck outright. Hold TypeScript at 6.x until
      # typescript-eslint ships TS >=7 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # lucide v1 removed every brand icon (trademark reasons), including
      # `Github`, which this site uses on the contact and projects pages.
      # Only generic marks (GitBranch, GitFork, …) remain, so upgrading means
      # choosing a replacement — a design decision, not a mechanical bump.
      # Hold at 0.x until that call is made.
      - dependency-name: "lucide-svelte"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
